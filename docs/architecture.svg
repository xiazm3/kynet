<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <title>kynet 分布式网游服务架构</title>
  <desc>3 玩家客户端 - 2 网关 - 3 Registry 集群 - 用户服务 - 场景服务 x2 - 数据服务 - 数据库</desc>

  <defs>
    <marker id="arrowData" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34495E"/>
    </marker>
    <marker id="arrowCtl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7F8C8D"/>
    </marker>
    <marker id="arrowGossip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8E44AD"/>
    </marker>
  </defs>

  <rect width="1240" height="800" fill="#FDFEFE"/>

  <!-- ===== 标题 ===== -->
  <text x="620" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#2C3E50">kynet 分布式网游服务架构</text>
  <text x="620" y="58" text-anchor="middle" font-size="12" fill="#7B8A97">Registry 注册发现 + ServiceNode Aeron 直连 + Action 接入模型</text>

  <!-- ===== Registry 集群（控制面） ===== -->
  <rect x="330" y="80" width="600" height="150" rx="12" fill="#F9F2FB" stroke="#B785CE" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="630" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#8E44AD">Registry 集群 ×3（控制面：注册 · 发现 · 心跳 · 故障摘除）</text>

  <g>
    <rect x="360" y="125" width="150" height="58" rx="8" fill="#F5EEF8" stroke="#8E44AD" stroke-width="1.5"/>
    <text x="435" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#6C3483">Registry-1</text>
    <text x="435" y="169" text-anchor="middle" font-size="11" fill="#9B7BB8">注册中心</text>
  </g>
  <g>
    <rect x="555" y="125" width="150" height="58" rx="8" fill="#F5EEF8" stroke="#8E44AD" stroke-width="1.5"/>
    <text x="630" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#6C3483">Registry-2</text>
    <text x="630" y="169" text-anchor="middle" font-size="11" fill="#9B7BB8">注册中心</text>
  </g>
  <g>
    <rect x="750" y="125" width="150" height="58" rx="8" fill="#F5EEF8" stroke="#8E44AD" stroke-width="1.5"/>
    <text x="825" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#6C3483">Registry-3</text>
    <text x="825" y="169" text-anchor="middle" font-size="11" fill="#9B7BB8">注册中心</text>
  </g>

  <!-- Gossip -->
  <line x1="512" y1="154" x2="553" y2="154" stroke="#8E44AD" stroke-width="1.4" stroke-dasharray="4 3" marker-start="url(#arrowGossip)" marker-end="url(#arrowGossip)"/>
  <line x1="707" y1="154" x2="748" y2="154" stroke="#8E44AD" stroke-width="1.4" stroke-dasharray="4 3" marker-start="url(#arrowGossip)" marker-end="url(#arrowGossip)"/>
  <text x="630" y="210" text-anchor="middle" font-size="11" fill="#8E44AD">节点间 HMAC Gossip 同步目录（UDP，认证）</text>

  <!-- ===== 控制面总线 ===== -->
  <line x1="270" y1="290" x2="885" y2="290" stroke="#95A5A6" stroke-width="1.3" stroke-dasharray="6 4"/>
  <line x1="577" y1="290" x2="577" y2="234" stroke="#7F8C8D" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arrowCtl)"/>
  <text x="588" y="252" font-size="11" fill="#7F8C8D">注册 · 发现 · 心跳</text>
  <text x="588" y="268" font-size="11" fill="#7F8C8D">（Netty TCP）</text>

  <g stroke="#95A5A6" stroke-width="1.3" stroke-dasharray="6 4" fill="none">
    <line x1="385" y1="350" x2="385" y2="290"/>
    <path d="M385,490 L385,458 L270,458 L270,290"/>
    <line x1="590" y1="340" x2="590" y2="290"/>
    <path d="M590,440 L590,425 L528,425 L528,290"/>
    <path d="M590,540 L590,525 L528,525 L528,425"/>
    <line x1="885" y1="440" x2="885" y2="290"/>
  </g>

  <!-- ===== 玩家客户端 ===== -->
  <g>
    <rect x="40" y="330" width="170" height="64" rx="8" fill="#EAF3FC" stroke="#3B82C4" stroke-width="1.5"/>
    <text x="125" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F4E79">玩家客户端 A</text>
    <text x="125" y="378" text-anchor="middle" font-size="11" fill="#5B87B5">游戏客户端</text>
  </g>
  <g>
    <rect x="40" y="430" width="170" height="64" rx="8" fill="#EAF3FC" stroke="#3B82C4" stroke-width="1.5"/>
    <text x="125" y="458" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F4E79">玩家客户端 B</text>
    <text x="125" y="478" text-anchor="middle" font-size="11" fill="#5B87B5">游戏客户端</text>
  </g>
  <g>
    <rect x="40" y="530" width="170" height="64" rx="8" fill="#EAF3FC" stroke="#3B82C4" stroke-width="1.5"/>
    <text x="125" y="558" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F4E79">玩家客户端 C</text>
    <text x="125" y="578" text-anchor="middle" font-size="11" fill="#5B87B5">游戏客户端</text>
  </g>

  <!-- 客户端 -> 网关 -->
  <g stroke="#34495E" stroke-width="1.6" fill="none">
    <line x1="210" y1="362" x2="300" y2="380" marker-end="url(#arrowData)"/>
    <line x1="210" y1="462" x2="300" y2="505" marker-end="url(#arrowData)"/>
    <line x1="210" y1="562" x2="300" y2="530" marker-end="url(#arrowData)"/>
  </g>
  <text x="255" y="320" text-anchor="middle" font-size="11" fill="#566573">外部接入</text>
  <text x="255" y="337" text-anchor="middle" font-size="10" fill="#566573">TCP · UDP · WS（TLS 可选）</text>

  <!-- ===== 网关 ===== -->
  <g>
    <rect x="300" y="350" width="170" height="76" rx="8" fill="#E6F7F1" stroke="#16A085" stroke-width="1.5"/>
    <text x="385" y="378" text-anchor="middle" font-size="14" font-weight="bold" fill="#0E6655">Gateway-1</text>
    <text x="385" y="397" text-anchor="middle" font-size="10" fill="#48A58F">tcp·tcps·udp·ws·wss</text>
    <text x="385" y="414" text-anchor="middle" font-size="10" fill="#48A58F">接入 · 鉴权 · 限流 · 踢人</text>
  </g>
  <g>
    <rect x="300" y="490" width="170" height="76" rx="8" fill="#E6F7F1" stroke="#16A085" stroke-width="1.5"/>
    <text x="385" y="518" text-anchor="middle" font-size="14" font-weight="bold" fill="#0E6655">Gateway-2</text>
    <text x="385" y="537" text-anchor="middle" font-size="10" fill="#48A58F">tcp·tcps·udp·ws·wss</text>
    <text x="385" y="554" text-anchor="middle" font-size="10" fill="#48A58F">接入 · 鉴权 · 限流 · 踢人</text>
  </g>

  <!-- ===== 业务服务 ===== -->
  <g>
    <rect x="560" y="340" width="170" height="70" rx="8" fill="#FEF3E7" stroke="#E67E22" stroke-width="1.5"/>
    <text x="645" y="370" text-anchor="middle" font-size="14" font-weight="bold" fill="#A04000">用户服务 ×1</text>
    <text x="645" y="390" text-anchor="middle" font-size="11" fill="#CE8A4E">登录 · 账号 · 会话</text>
  </g>
  <g>
    <rect x="560" y="440" width="170" height="70" rx="8" fill="#FEF3E7" stroke="#E67E22" stroke-width="1.5"/>
    <text x="645" y="470" text-anchor="middle" font-size="14" font-weight="bold" fill="#A04000">场景服务 ①</text>
    <text x="645" y="490" text-anchor="middle" font-size="11" fill="#CE8A4E">战斗 · 逻辑同步（实例 1）</text>
  </g>
  <g>
    <rect x="560" y="540" width="170" height="70" rx="8" fill="#FEF3E7" stroke="#E67E22" stroke-width="1.5"/>
    <text x="645" y="570" text-anchor="middle" font-size="14" font-weight="bold" fill="#A04000">场景服务 ②</text>
    <text x="645" y="590" text-anchor="middle" font-size="11" fill="#CE8A4E">战斗 · 逻辑同步（实例 2）</text>
  </g>

  <!-- ===== 数据服务 ===== -->
  <g>
    <rect x="800" y="440" width="170" height="70" rx="8" fill="#FDF2E9" stroke="#D35400" stroke-width="1.5"/>
    <text x="885" y="470" text-anchor="middle" font-size="14" font-weight="bold" fill="#935116">数据服务 ×1</text>
    <text x="885" y="490" text-anchor="middle" font-size="11" fill="#C1834F">持久化 · 落库代理</text>
  </g>

  <!-- ===== 数据库 ===== -->
  <g>
    <path d="M1030,445 L1030,505 A75,12 0 0 0 1180,505 L1180,445" fill="#ECEFF1" stroke="#5D6D7E" stroke-width="1.5"/>
    <ellipse cx="1105" cy="445" rx="75" ry="12" fill="#F5F7F8" stroke="#5D6D7E" stroke-width="1.5"/>
    <text x="1105" y="480" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C3E50">数据库</text>
    <text x="1105" y="498" text-anchor="middle" font-size="10" fill="#7B8A97">MySQL · Redis 等</text>
  </g>

  <!-- ===== 数据面连线（双向：RPC / 推送 / 广播） ===== -->
  <g stroke="#34495E" stroke-width="1.6" fill="none">
    <line x1="470" y1="372" x2="560" y2="372" marker-start="url(#arrowData)" marker-end="url(#arrowData)"/>
    <line x1="470" y1="400" x2="560" y2="455" marker-start="url(#arrowData)" marker-end="url(#arrowData)"/>
    <line x1="470" y1="505" x2="560" y2="490" marker-start="url(#arrowData)" marker-end="url(#arrowData)"/>
    <line x1="470" y1="545" x2="560" y2="565" marker-start="url(#arrowData)" marker-end="url(#arrowData)"/>
    <line x1="645" y1="410" x2="645" y2="440" marker-start="url(#arrowData)" marker-end="url(#arrowData)"/>
    <line x1="730" y1="375" x2="800" y2="455" marker-start="url(#arrowData)" marker-end="url(#arrowData)"/>
    <line x1="730" y1="475" x2="800" y2="475" marker-start="url(#arrowData)" marker-end="url(#arrowData)"/>
    <line x1="730" y1="565" x2="800" y2="495" marker-start="url(#arrowData)" marker-end="url(#arrowData)"/>
    <line x1="970" y1="475" x2="1026" y2="475" marker-end="url(#arrowData)"/>
  </g>
  <text x="653" y="431" font-size="10" fill="#7B8A97">互调</text>
  <text x="998" y="466" text-anchor="middle" font-size="11" fill="#566573">读写</text>

  <text x="640" y="632" text-anchor="middle" font-size="11" fill="#566573">数据面直连：RPC · 推送 · 广播（同机 Aeron IPC / 跨机 UDP）</text>

  <!-- ===== 图例 ===== -->
  <rect x="40" y="650" width="430" height="120" rx="8" fill="#FBFBFB" stroke="#D5D8DC" stroke-width="1"/>
  <text x="55" y="672" font-size="12" font-weight="bold" fill="#2C3E50">图例</text>
  <line x1="55" y1="692" x2="105" y2="692" stroke="#34495E" stroke-width="1.6" marker-start="url(#arrowData)" marker-end="url(#arrowData)"/>
  <text x="115" y="696" font-size="11" fill="#566573">数据面直连：RPC / 推送 / 广播</text>
  <line x1="55" y1="718" x2="105" y2="718" stroke="#95A5A6" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="115" y="722" font-size="11" fill="#566573">控制面：注册 / 发现 / 心跳</text>
  <line x1="55" y1="744" x2="105" y2="744" stroke="#8E44AD" stroke-width="1.4" stroke-dasharray="4 3" marker-start="url(#arrowGossip)" marker-end="url(#arrowGossip)"/>
  <text x="115" y="748" font-size="11" fill="#566573">Registry 节点间 Gossip（HMAC 认证 UDP）</text>

  <!-- ===== 要点 ===== -->
  <rect x="490" y="650" width="700" height="120" rx="8" fill="#FBFBFB" stroke="#D5D8DC" stroke-width="1"/>
  <text x="505" y="672" font-size="12" font-weight="bold" fill="#2C3E50">要点</text>
  <text x="505" y="694" font-size="11" fill="#566573">· Registry 只做注册发现，不承载业务流量；Registry 故障不影响已建立的直连通道</text>
  <text x="505" y="715" font-size="11" fill="#566573">· 场景服务 ×2 为同一 ServiceId 的多实例，按本地目录路由；网关、服务均可水平扩容</text>
  <text x="505" y="736" font-size="11" fill="#566573">· 故障节点由心跳自动摘除，目录最终一致，调用方需处理 NO_PROVIDER / 超时 / 结果未知</text>
  <text x="505" y="757" font-size="11" fill="#566573">· 客户端可连接任意网关；推送按目标网关精准投递，未知时全量扇出、网关本地过滤</text>
</svg>
